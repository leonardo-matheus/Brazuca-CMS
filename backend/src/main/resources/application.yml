server:
  port: 8080

spring:
  application:
    name: brazuca-cms-backend

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:file:./data/brazucacms;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# JWT Configuration
jwt:
  secret: brazuca-cms-secret-key-2026-very-long-and-secure-key-for-jwt-tokens-minimum-256-bits
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# Stripe Configuration
stripe:
  api-key: ${STRIPE_API_KEY:sk_test_your_test_key_here}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret_here}
  prices:
    starter: ${STRIPE_PRICE_STARTER:price_starter_free}
    pro-monthly: ${STRIPE_PRICE_PRO_MONTHLY:price_pro_monthly}
    pro-yearly: ${STRIPE_PRICE_PRO_YEARLY:price_pro_yearly}
    enterprise-monthly: ${STRIPE_PRICE_ENTERPRISE_MONTHLY:price_enterprise_monthly}
    enterprise-yearly: ${STRIPE_PRICE_ENTERPRISE_YEARLY:price_enterprise_yearly}

# Instagram/Meta API Configuration
instagram:
  app-id: ${INSTAGRAM_APP_ID:your_meta_app_id}
  app-secret: ${INSTAGRAM_APP_SECRET:your_meta_app_secret}
  redirect-uri: ${INSTAGRAM_REDIRECT_URI:http://localhost:3000/dashboard/settings/social/callback}
  api-version: v18.0

# Integration Configurations
integration:
  # GitHub
  github:
    client-id: ${GITHUB_CLIENT_ID:your_github_client_id}
    client-secret: ${GITHUB_CLIENT_SECRET:your_github_client_secret}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:your_webhook_secret}
  
  # Shopify
  shopify:
    client-id: ${SHOPIFY_CLIENT_ID:your_shopify_client_id}
    client-secret: ${SHOPIFY_CLIENT_SECRET:your_shopify_client_secret}
    scopes: read_products,write_products,read_orders,read_customers,read_inventory
  
  # Klaviyo
  klaviyo:
    api-key: ${KLAVIYO_API_KEY:your_klaviyo_api_key}
  
  # Stripe (Integration service)
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_your_key}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_your_key}
    webhook-secret: ${STRIPE_INTEGRATION_WEBHOOK_SECRET:whsec_your_secret}
  
  # Auth0
  auth0:
    domain: ${AUTH0_DOMAIN:your-tenant.auth0.com}
    client-id: ${AUTH0_CLIENT_ID:your_auth0_client_id}
    client-secret: ${AUTH0_CLIENT_SECRET:your_auth0_client_secret}
    audience: ${AUTH0_AUDIENCE:https://your-api.com}

# Application Configuration
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000
  upload:
    dir: ./uploads
    max-file-size: 52428800 # 50MB in bytes

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    com.brazucacms: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
