server:
  port: 8080

spring:
  application:
    name: brazuca-cms-backend

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:file:./data/brazucacms;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# JWT Configuration
jwt:
  secret: brazuca-cms-secret-key-2026-very-long-and-secure-key-for-jwt-tokens-minimum-256-bits
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# Stripe Configuration
stripe:
  api-key: ${STRIPE_API_KEY:sk_test_your_test_key_here}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret_here}
  prices:
    starter: ${STRIPE_PRICE_STARTER:price_starter_free}
    pro-monthly: ${STRIPE_PRICE_PRO_MONTHLY:price_pro_monthly}
    pro-yearly: ${STRIPE_PRICE_PRO_YEARLY:price_pro_yearly}
    enterprise-monthly: ${STRIPE_PRICE_ENTERPRISE_MONTHLY:price_enterprise_monthly}
    enterprise-yearly: ${STRIPE_PRICE_ENTERPRISE_YEARLY:price_enterprise_yearly}

# Application Configuration
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000
  upload:
    dir: ./uploads
    max-file-size: 52428800 # 50MB in bytes

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    com.brazucacms: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
