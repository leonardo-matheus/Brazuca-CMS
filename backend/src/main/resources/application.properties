# ==============================================================================
# BRAZUCA CMS - APPLICATION PROPERTIES
# Configuração principal da aplicação Spring Boot
# ==============================================================================

# ------------------------------------------------------------------------------
# SERVER CONFIGURATION
# Configurações do servidor Tomcat embarcado
# ------------------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/

# ------------------------------------------------------------------------------
# SPRING APPLICATION
# Configurações básicas do Spring Boot
# ------------------------------------------------------------------------------
spring.application.name=brazuca-cms-backend

# ------------------------------------------------------------------------------
# DATABASE CONFIGURATION (H2)
# Banco de dados H2 embarcado para desenvolvimento
# Para produção, substituir por PostgreSQL ou MySQL
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/brazucacms;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console - Acessar em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ------------------------------------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# Configurações do ORM Hibernate
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# ddl-auto options: none, validate, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# JWT CONFIGURATION
# Configurações de autenticação JWT (JSON Web Token)
# IMPORTANTE: Em produção, use uma chave secreta forte e única!
# ------------------------------------------------------------------------------
# Chave secreta para assinatura dos tokens (mínimo 256 bits / 32 caracteres)
jwt.secret=BrazucaCMS-SuperSecretKey-2026-JWT-Authentication-256bit-Minimum-Required
# Tempo de expiração do access token (24 horas em milissegundos)
jwt.expiration=86400000
# Tempo de expiração do refresh token (7 dias em milissegundos)
jwt.refresh-expiration=604800000
# Issuer do token
jwt.issuer=brazuca-cms
# Algoritmo de assinatura
jwt.algorithm=HS256

# ------------------------------------------------------------------------------
# FILE UPLOAD CONFIGURATION
# Configurações para upload de arquivos e mídia
# ------------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Diretório para armazenamento de uploads
app.upload.dir=./uploads
# Tamanho máximo de arquivo em bytes (50MB)
app.upload.max-file-size=52428800

# ------------------------------------------------------------------------------
# CORS CONFIGURATION
# Origens permitidas para requisições cross-origin
# ------------------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000

# ------------------------------------------------------------------------------
# JACKSON JSON CONFIGURATION
# Configurações de serialização/deserialização JSON
# ------------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=America/Sao_Paulo

# ------------------------------------------------------------------------------
# SPRINGDOC OPENAPI / SWAGGER UI
# Documentação interativa da API
# Acessar em http://localhost:8080/swagger-ui.html
# ------------------------------------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true

# Informações do OpenAPI
springdoc.info.title=Brazuca CMS API
springdoc.info.description=API RESTful para o Brazuca CMS - Plataforma Headless CMS SaaS
springdoc.info.version=1.0.0
springdoc.info.contact.name=Brazuca CMS Team
springdoc.info.contact.email=suporte@brazucacms.com
springdoc.info.license.name=MIT License

# ------------------------------------------------------------------------------
# LOGGING CONFIGURATION
# Configurações de logs da aplicação
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.brazucacms=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ------------------------------------------------------------------------------
# ACTUATOR CONFIGURATION (Opcional - Monitoramento)
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
